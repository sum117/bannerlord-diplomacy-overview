name: Release

# Cut a release by pushing a version tag, e.g.:  git tag v1.0.0 && git push origin v1.0.0
# The tag name becomes the release name and the artifact zip suffix. It must match the <Version> in
# the csproj / SubModule.xml — the "Verify tag" step fails the run otherwise.
#
# The same zip is then uploaded to Nexus Mods (mod page 12242) as a new version of the existing main
# file. Repo settings it reads:
#   - secret   NEXUSMODS_API_KEY  — personal key from https://www.nexusmods.com/settings/api-keys
#   - variable NEXUSMODS_FILE_ID  — the v3 API "mod file" id = the file *group* id (7696464), NOT the
#                                   file id in download URLs (63480)
#   - variable NEXUSMODS_MOD_ID   — the v3 API mod uid (13632226209746), NOT the page number (12242);
#                                   optional, enables the changelog entry
# Both ids are attributes of the Files tab → "Advanced" dialog (file-group-id / mod-uid).
# Without NEXUSMODS_FILE_ID the Nexus step is skipped with a warning; the GitHub release still ships.
on:
  push:
    tags:
      - "v*"

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

permissions:
  contents: write # required to create the GitHub Release

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Fail before building if the tag and the shipped version disagree: the launcher shows the
      # SubModule.xml version, Nexus shows the tag's — a mismatch makes update checks lie to users.
      - name: Verify tag matches module version
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $module = ([xml](Get-Content "src/DiplomacyOverview/_Module/SubModule.xml")).Module.Version.value
          $csproj = [xml](Get-Content "src/DiplomacyOverview/DiplomacyOverview.csproj")
          $assembly = "v" + ($csproj.Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1)
          $game = ($csproj.Project.PropertyGroup.GameVersion | Where-Object { $_ } | Select-Object -First 1)
          if ($module -ne $tag -or $assembly -ne $tag) {
            Write-Error "Tag $tag does not match SubModule.xml ($module) / csproj ($assembly). Bump both, then re-tag."
            exit 1
          }
          "number=$($tag.TrimStart('v'))" >> $env:GITHUB_OUTPUT
          "game=$($game -replace '\.\d+$','')" >> $env:GITHUB_OUTPUT

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build (Release)
        run: dotnet build DiplomacyOverview.sln -c Release

      - name: Test
        run: dotnet test DiplomacyOverview.sln -c Release --no-build

      # Assemble the packed module in the install layout users expect: a DiplomacyOverview/ folder
      # they drop into <game>\Modules\. Mirrors the on-machine BuildResources deploy — _Module\**
      # verbatim plus our own DLLs (+ pdbs) under bin\Win64_Shipping_Client. Only DiplomacyOverview*
      # DLLs ship; no TaleWorlds/framework DLLs (P-03, enforced by ArchitectureInvariantTests).
      - name: Stage packed module
        shell: pwsh
        run: |
          $staging = "artifact-staging/DiplomacyOverview"
          New-Item -ItemType Directory -Force -Path "$staging/bin/Win64_Shipping_Client" | Out-Null
          Copy-Item -Path "src/DiplomacyOverview/_Module/*" -Destination $staging -Recurse -Force
          $bin = "src/DiplomacyOverview/bin/x64/Release/net472"
          Copy-Item -Path "$bin/DiplomacyOverview*.dll" -Destination "$staging/bin/Win64_Shipping_Client/" -Force
          Copy-Item -Path "$bin/DiplomacyOverview*.pdb" -Destination "$staging/bin/Win64_Shipping_Client/" -Force

      - name: Zip the module folder
        shell: pwsh
        run: Compress-Archive -Path "artifact-staging/DiplomacyOverview" -DestinationPath "DiplomacyOverview-${{ github.ref_name }}.zip"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: DiplomacyOverview-${{ github.ref_name }}.zip
          generate_release_notes: true
          fail_on_unmatched_files: true

      # Adds a new version to the existing Nexus main file (v3 upload API). Runs after the GitHub
      # release so a Nexus outage never blocks it. If only this step fails, re-run the job (the
      # release step is idempotent) or upload the release zip by hand — do not re-tag.
      - name: Upload to Nexus Mods
        if: vars.NEXUSMODS_FILE_ID != ''
        uses: Nexus-Mods/upload-action@c96019556046053aa26044b44396cd38929daf23 # v1.0.0-beta.10
        with:
          api_key: ${{ secrets.NEXUSMODS_API_KEY }}
          file_id: ${{ vars.NEXUSMODS_FILE_ID }}
          filename: DiplomacyOverview-${{ github.ref_name }}.zip
          version: ${{ steps.version.outputs.number }}
          display_name: DiplomacyOverview V${{ steps.version.outputs.number }}
          description: For Bannerlord v${{ steps.version.outputs.game }}. If you find any issues with the mod, file an issue at https://github.com/${{ github.repository }}.
          category: main
          archive_existing_version: true
          primary_mod_manager_download: true
          update_mod_version: true
          mod_id: ${{ vars.NEXUSMODS_MOD_ID }}
          changelog: ${{ vars.NEXUSMODS_MOD_ID != '' && format('Release notes - https://github.com/{0}/releases/tag/{1}', github.repository, github.ref_name) || '' }}

      - name: Nexus upload skipped
        if: vars.NEXUSMODS_FILE_ID == ''
        run: echo "::warning::NEXUSMODS_FILE_ID is not set - skipped the Nexus Mods upload. See the header of release.yml."
